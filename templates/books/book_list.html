{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h2>Books</h2><a class="btn btn-primary" href="{% url 'book_create' %}">Add Book</a></div><form class="my-3"><input name="q" value="{{ query }}" placeholder="Search title, author or ISBN"><button class="btn btn-outline-primary">Search</button></form><table class="table table-hover bg-white"><tr><th>Title</th><th>Author</th><th>ISBN</th><th>Category</th><th>Copies</th></tr>{% for b in books %}<tr><td>{{ b.title }}</td><td>{{ b.author }}</td><td>{{ b.isbn }}</td><td>{{ b.category }}</td><td>{{ b.copies.count }}</td></tr>{% empty %}<tr><td colspan="5">No books yet.</td></tr>{% endfor %}</table>{% endblock %}
