{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h2>Members</h2><a class="btn btn-primary" href="{% url 'member_create' %}">Add Member</a></div><table class="table bg-white mt-3"><tr><th>Member ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Department</th></tr>{% for m in members %}<tr><td>{{ m.member_id }}</td><td>{{ m.user.get_full_name|default:m.user.username }}</td><td>{{ m.user.email }}</td><td>{{ m.phone }}</td><td>{{ m.department }}</td></tr>{% empty %}<tr><td colspan="5">No members.</td></tr>{% endfor %}</table>{% endblock %}
