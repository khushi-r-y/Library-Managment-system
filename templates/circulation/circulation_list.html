{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h2>Issue / Return</h2><a class="btn btn-primary" href="{% url 'issue_book' %}">Issue Book</a></div><table class="table bg-white mt-3"><tr><th>Member</th><th>Book</th><th>Due</th><th>Status</th><th></th></tr>{% for r in records %}<tr><td>{{ r.member }}</td><td>{{ r.book_copy.book.title }}</td><td>{{ r.due_date }}</td><td>{{ r.get_status_display }}</td><td>{% if r.status != 'RETURNED' %}<a href="{% url 'return_book' r.id %}">Return</a>{% endif %}</td></tr>{% empty %}<tr><td colspan="5">No records.</td></tr>{% endfor %}</table>{% endblock %}
